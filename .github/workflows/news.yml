name: Сбор новостей

on:
  # Расписание задаётся в UTC. Астана — UTC+5 без перехода на летнее время.
  #
  # Время намеренно сдвинуто с круглого часа на :10. Расписание в Actions —
  # по остаточному принципу, и начало часа приходится на пик нагрузки: прогон
  # уезжает на 5-30 минут или отбрасывается совсем. Ближе к середине часа
  # задержки заметно короче.
  #
  #   12:10 → 07:10   14:10 → 09:10   16:30 → 11:30   19:10 → 14:10
  #   21:10 → 16:10   23:10 → 18:10   00:10 → 19:10
  schedule:
    - cron: "10 7 * * *"
    - cron: "10 9 * * *"
    - cron: "30 11 * * *"
    - cron: "10 14 * * *"
    - cron: "10 16 * * *"
    - cron: "10 18 * * *"
    - cron: "10 19 * * *"
  # Позволяет запустить сбор вручную кнопкой на вкладке Actions
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Сколько постов отправить максимум (для пробного прогона)"
        required: false
        default: "30"

# Два прогона одновременно не нужны: они бы дублировали запросы к X
concurrency:
  group: news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Восстановить ключ сервисного аккаунта Google
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Собрать и отправить новости
        env:
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_CREDENTIALS_PATH: ./credentials.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TWEETS_PER_ACCOUNT: "10"
          MIN_LIKES: "5000"
          MAX_AGE_HOURS: "48"
          MAX_POSTS_PER_RUN: ${{ inputs.max_posts || '30' }}
          ACCOUNTS_PER_BATCH: "10"
          REQUEST_DELAY_SECONDS: "5"
        run: python run_once.py

      - name: Убрать ключ
        if: always()
        run: rm -f credentials.json
